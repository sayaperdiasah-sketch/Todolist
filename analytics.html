<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Analisis Data — Jejak Menuju Target</title>

    <!-- Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eff6ff',
                            100: '#dbeafe',
                            500: '#3b82f6',
                            600: '#2563eb',
                            700: '#1d4ed8',
                            800: '#1e40af',
                            900: '#1e3a8a',
                        },
                        good: '#22c55e',
                        bad: '#ef4444',
                        warning: '#f59e0b',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen font-sans antialiased">

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-50 border-b border-gray-100">
        <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <a href="index.html" class="text-gray-400 hover:text-brand-600 p-2">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div>
                    <h1 class="text-lg font-bold text-gray-800">Analisis Data</h1>
                    <p class="text-xs text-gray-400">Visualisasi tren harian</p>
                </div>
            </div>
            <button onclick="window.location.href='history.html'" class="bg-brand-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-brand-700 transition">
                <i class="fa-solid fa-table mr-1"></i> Lihat Riwayat
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- ============ RINGKASAN ============ -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white rounded-2xl shadow-sm p-4 text-center border-l-4 border-brand-500">
                <p class="text-2xl font-bold text-brand-600" id="totalData">0</p>
                <p class="text-xs text-gray-500">Total Data</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-4 text-center border-l-4 border-green-500">
                <p class="text-2xl font-bold text-green-600" id="rataMood">-</p>
                <p class="text-xs text-gray-500">Rata-rata Mood</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-4 text-center border-l-4 border-purple-500">
                <p class="text-2xl font-bold text-purple-600" id="rataScreenTime">-</p>
                <p class="text-xs text-gray-500">Rata-rata Screen Time (jam)</p>
            </div>
            <div class="bg-white rounded-2xl shadow-sm p-4 text-center border-l-4 border-amber-500">
                <p class="text-2xl font-bold text-amber-600" id="rataRisk">-</p>
                <p class="text-xs text-gray-500">Rata-rata Risk Score</p>
            </div>
        </section>

        <!-- ============ GRAFIK PSIKIS ============ -->
        <section class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="font-semibold text-gray-800 mb-4">📈 Tren Kondisi Psikis</h3>
            <div class="h-72">
                <canvas id="chartPsikis"></canvas>
            </div>
        </section>

        <!-- ============ GRAFIK SCREEN TIME & TIDUR ============ -->
        <section class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="font-semibold text-gray-800 mb-4">📱 Screen Time & 😴 Jam Tidur</h3>
            <div class="h-72">
                <canvas id="chartScreenTidur"></canvas>
            </div>
        </section>

        <!-- ============ GRAFIK DISTRIBUSI STATUS ============ -->
        <section class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="font-semibold text-gray-800 mb-4">📊 Distribusi Status Check-in</h3>
            <div class="h-64 max-w-sm mx-auto">
                <canvas id="chartStatus"></canvas>
            </div>
        </section>

        <!-- ============ GRAFIK RISK SCORE ============ -->
        <section class="bg-white rounded-2xl shadow-sm p-6">
            <h3 class="font-semibold text-gray-800 mb-4">⚠️ Tren Risk Score</h3>
            <div class="h-64">
                <canvas id="chartRisk"></canvas>
            </div>
        </section>

    </main>

    <footer class="text-center text-xs text-gray-400 py-6">
        Dibuat untuk akuntabilitas pribadi | © 2025
    </footer>

    <script>
        const STORAGE_KEY_RIWAYAT = 'riwayatCheckIn';

        function getRiwayat() {
            return JSON.parse(localStorage.getItem(STORAGE_KEY_RIWAYAT)) || [];
        }

        document.addEventListener('DOMContentLoaded', function() {
            const riwayat = getRiwayat();
            if (riwayat.length === 0) {
                // Tampilkan pesan jika belum ada data
                document.querySelector('main').innerHTML = `
                    <div class="text-center py-20">
                        <i class="fa-solid fa-chart-line text-6xl text-gray-300 mb-4"></i>
                        <p class="text-gray-400 text-lg">Belum ada data untuk dianalisis.</p>
                        <p class="text-gray-400 text-sm mt-2">Lakukan check-in harian terlebih dahulu.</p>
                        <button onclick="window.location.href='index.html'" class="mt-6 bg-brand-600 text-white px-6 py-3 rounded-xl font-semibold hover:bg-brand-700 transition">
                            <i class="fa-solid fa-plus mr-2"></i> Mulai Check-in
                        </button>
                    </div>
                `;
                return;
            }

            // Update ringkasan
            updateRingkasan(riwayat);

            // Buat grafik
            buatGrafikPsikis(riwayat);
            buatGrafikScreenTidur(riwayat);
            buatGrafikStatus(riwayat);
            buatGrafikRisk(riwayat);
        });

        function updateRingkasan(riwayat) {
            document.getElementById('totalData').textContent = riwayat.length;

            const avgMood = riwayat.reduce((sum, r) => sum + (r.mood_level || 0), 0) / riwayat.length;
            document.getElementById('rataMood').textContent = avgMood.toFixed(1);

            const avgScreen = riwayat.reduce((sum, r) => sum + (r.screen_time || 0), 0) / riwayat.length;
            document.getElementById('rataScreenTime').textContent = avgScreen.toFixed(1) + ' jam';

            const avgRisk = riwayat.reduce((sum, r) => sum + (r.risk_score_rule || 0), 0) / riwayat.length;
            document.getElementById('rataRisk').textContent = avgRisk.toFixed(1);
        }

        function buatGrafikPsikis(riwayat) {
            const ctx = document.getElementById('chartPsikis').getContext('2d');
            const labels = riwayat.map(r => r.tanggal);
            const dataStres = riwayat.map(r => r.stres_level || 0);
            const dataMood = riwayat.map(r => r.mood_level || 0);
            const dataEnergi = riwayat.map(r => r.energi_level || 0);
            const dataFokus = riwayat.map(r => r.fokus_level || 0);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Stres',
                            data: dataStres,
                            borderColor: '#ef4444',
                            backgroundColor: 'rgba(239,68,68,0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 4,
                        },
                        {
                            label: 'Mood',
                            data: dataMood,
                            borderColor: '#22c55e',
                            backgroundColor: 'rgba(34,197,94,0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 4,
                        },
                        {
                            label: 'Energi',
                            data: dataEnergi,
                            borderColor: '#f59e0b',
                            backgroundColor: 'rgba(245,158,11,0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 4,
                        },
                        {
                            label: 'Fokus',
                            data: dataFokus,
                            borderColor: '#3b82f6',
                            backgroundColor: 'rgba(59,130,246,0.1)',
                            tension: 0.3,
                            fill: true,
                            pointRadius: 4,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 1,
                            max: 10,
                            ticks: { stepSize: 1 }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });
        }

        function buatGrafikScreenTidur(riwayat) {
            const ctx = document.getElementById('chartScreenTidur').getContext('2d');
            const labels = riwayat.map(r => r.tanggal);
            const dataScreen = riwayat.map(r => r.screen_time || 0);
            const dataTidur = riwayat.map(r => r.jam_tidur || 0);

            new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [
                        {
                            label: 'Screen Time (jam)',
                            data: dataScreen,
                            backgroundColor: 'rgba(147,51,234,0.6)',
                            borderColor: '#9333ea',
                            borderWidth: 1,
                            borderRadius: 6,
                        },
                        {
                            label: 'Jam Tidur',
                            data: dataTidur,
                            backgroundColor: 'rgba(99,102,241,0.6)',
                            borderColor: '#6366f1',
                            borderWidth: 1,
                            borderRadius: 6,
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: { stepSize: 2 }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });
        }

        function buatGrafikStatus(riwayat) {
            const ctx = document.getElementById('chartStatus').getContext('2d');
            const counts = {
                done: riwayat.filter(r => r.status_checkin === 'done').length,
                partial: riwayat.filter(r => r.status_checkin === 'partial').length,
                skipped: riwayat.filter(r => r.status_checkin === 'skipped').length,
            };

            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Selesai', 'Sebagian', 'Dilewati'],
                    datasets: [{
                        data: [counts.done, counts.partial, counts.skipped],
                        backgroundColor: ['#22c55e', '#f59e0b', '#ef4444'],
                        borderWidth: 2,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                        }
                    }
                }
            });
        }

        function buatGrafikRisk(riwayat) {
            const ctx = document.getElementById('chartRisk').getContext('2d');
            const labels = riwayat.map(r => r.tanggal);
            const dataRisk = riwayat.map(r => r.risk_score_rule || 0);

            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Risk Score',
                        data: dataRisk,
                        borderColor: '#ef4444',
                        backgroundColor: 'rgba(239,68,68,0.1)',
                        tension: 0.4,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: dataRisk.map(v => v < 30 ? '#22c55e' : v < 60 ? '#f59e0b' : '#ef4444'),
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: 0,
                            max: 100,
                            ticks: { stepSize: 20 }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
